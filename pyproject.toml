[project]
name = "family-ai-assistant"
version = "0.1.0"
description = "A private, local-first family assistant orchestrated with LangGraph"
requires-python = ">=3.11"
dependencies = [
  "ddgs>=9.9,<10",
  "fastapi>=0.116,<1",
  "langchain-ollama>=0.3,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "mcp>=1.20,<2",
  "mlx-whisper>=0.4,<1",
  "mlx-audio>=0.3,<1",
  "misaki[zh]>=0.9,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
family-ai-mcp = "family_ai.mcp_server:main"

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9"]
postgres = ["langgraph-checkpoint-postgres>=2,<4", "psycopg[binary,pool]>=3.2,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/family_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
